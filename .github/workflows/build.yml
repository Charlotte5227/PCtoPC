name: Windows build and verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build PCtoPC.slnx -c Release -m:1
      - name: Unit and real HTTPS integration tests (power is simulated)
        run: dotnet run --project tests/PCtoPC.Tests -c Release --no-build
      - name: Publish Windows x64 self-contained application
        shell: pwsh
        run: ./scripts/Publish.ps1
      - name: Upload portable application
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PCtoPC-win-x64
          path: artifacts/PCtoPC-win-x64
          if-no-files-found: error
